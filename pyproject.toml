[project]
name = "data-agent-mnist"
version = "0.1.0"
description = "Synthetic, private, repeatable text2sql benchmark for ClickHouse data warehouse AI agents."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.111.0",
    "boto3>=1.34.0",
    # >=4.3, not >=2.0. chdb 4.1.x fails intermittently on x86_64 when a store
    # written by one process is opened by another: the async table loader dies
    # with "recursive_mutex lock failed: Invalid argument" and the session never
    # comes up.
    "chdb>=4.3",
    "clickhouse-connect>=0.6.0",
    "faker>=40.28.1",
    "google-auth>=2.0",
    "httpx>=0.27",
    "langfuse>=4,<5",
    "mlflow>=2.0",
    "openai>=1.40",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
